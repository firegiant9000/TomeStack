name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The repo is public: planning notes (docs/superpowers/, any .superpowers/) stay local and are ignored. Fail if one is tracked, in any letter case.
      - name: No planning notes tracked
        shell: pwsh
        run: |
          $tracked = git ls-files -- ':(icase)docs/superpowers' ':(icase,glob)**/.superpowers/**'
          if ($tracked) { 'Tracked planning notes; remove them from the index:'; $tracked; exit 1 }
          'No planning notes tracked.'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Ui/package-lock.json

      - name: UI install
        working-directory: src/Ui
        run: npm ci

      - name: UI typecheck and build
        working-directory: src/Ui
        run: npm run build

      # The desktop shell refuses to build without src/Ui/dist/index.html, so the dotnet and gui jobs take this bundle.
      - name: Upload UI bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-dist
          path: src/Ui/dist
          retention-days: 1
          if-no-files-found: error

  ui-test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Ui/package-lock.json

      - name: UI install
        working-directory: src/Ui
        run: npm ci

      - name: UI lint
        working-directory: src/Ui
        run: npm run lint

      - name: UI unit tests
        working-directory: src/Ui
        run: npm test

  dotnet:
    needs: [ui-build]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Download UI bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-dist
          path: src/Ui/dist

      - name: .NET build
        run: dotnet build TomeStack.slnx -c Release

      - name: .NET tests
        run: dotnet test TomeStack.slnx -c Release --no-build

  gui:
    needs: [ui-build]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Ui/package-lock.json

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Download UI bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-dist
          path: src/Ui/dist

      - name: UI install
        working-directory: src/Ui
        run: npm ci

      - name: .NET build
        run: dotnet build TomeStack.slnx -c Release

      # Starts the Release DevHost on a free loopback port with a throwaway data folder; no GUI needed.
      - name: UI flow against DevHost (e2e)
        working-directory: src/Ui
        run: npm run test:e2e

      # Evidence for ADR-006/ADR-008: the runner image lists Edge but not the WebView2 Runtime, and whether a
      # desktop session is available is unproven. Record what is there before trying the GUI smoke.
      - name: Probe WebView2 Runtime (evidence)
        shell: pwsh
        run: |
          $keys = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
                  'HKCU:\Software\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $found = $keys | Where-Object { Test-Path $_ } | ForEach-Object { (Get-ItemProperty $_).pv }
          "WebView2 Runtime: $(if ($found) { $found -join ', ' } else { 'not found' })"
          "Session: $([Environment]::UserInteractive) / $env:SESSIONNAME"
          # A hosted run ignored WEBVIEW2_BROWSER_EXECUTABLE_FOLDER; record loader policy overrides for the diagnosis.
          $policy = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2', 'HKCU:\Software\Policies\Microsoft\Edge\WebView2' | Where-Object { Test-Path $_ }
          "WebView2 loader policy keys: $(if ($policy) { $policy -join ', ' } else { 'none' })"

      # Launches the real WPF + WebView2 shell, loads the bundled UI, round-trips commands over the message bridge,
      # then creates, exports and previews a fixture character. Blocking since M2.1: every hosted run that reached it
      # logged PASS (8 of 8 on 2026-09-28), past the "three consecutive green runs" rule (ADR-006).
      - name: Desktop shell smoke
        id: smoke
        shell: pwsh
        run: scripts/smoke.ps1 -Exe src/DesktopShell/bin/Release/net10.0-windows/TomeStack.exe -Report "$env:RUNNER_TEMP/smoke-result.json"

      # M2.1: two real TomeStack.exe processes on one data folder; the second hands over and exits, and the folder
      # still works once the first closes. Blocking since it passed three consecutive hosted runs (36474541648,
      # 36475494877, 36475497184 on 2026-09-28).
      - name: Two instances on one data folder
        shell: pwsh
        run: scripts/single-instance-check.ps1 -Exe src/DesktopShell/bin/Release/net10.0-windows/TomeStack.exe

      # Uses the smoke-only --simulate-missing-webview2 flag; the loader env override was ignored on this runner.
      - name: Missing WebView2 runtime path (non-blocking)
        continue-on-error: true
        shell: pwsh
        run: scripts/offline-check.ps1 -Mode MissingRuntime

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-result
          path: ${{ runner.temp }}/smoke-result.json
          if-no-files-found: warn

  # The one check the repository ruleset requires. It stays named build-test and passes only if every job passed.
  build-test:
    needs: [ui-build, ui-test, dotnet, gui]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job to succeed
        shell: bash
        run: |
          fail=0
          check() { echo "$1: $2"; if [ "$2" != "success" ]; then fail=1; fi; }
          check ui-build "${{ needs.ui-build.result }}" # success required
          check ui-test "${{ needs.ui-test.result }}" # success required
          check dotnet "${{ needs.dotnet.result }}" # success required
          check gui "${{ needs.gui.result }}" # success required
          exit $fail
