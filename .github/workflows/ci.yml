name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Ui/package-lock.json

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: UI install
        working-directory: src/Ui
        run: npm ci

      - name: UI lint
        working-directory: src/Ui
        run: npm run lint

      - name: UI unit tests
        working-directory: src/Ui
        run: npm test

      - name: UI typecheck and build
        working-directory: src/Ui
        run: npm run build

      - name: .NET build
        run: dotnet build TomeStack.slnx -c Release

      - name: .NET tests
        run: dotnet test TomeStack.slnx -c Release --no-build

      # Starts the Release DevHost on a free loopback port with a throwaway data folder; no GUI needed.
      - name: UI flow against DevHost (e2e)
        working-directory: src/Ui
        run: npm run test:e2e

      # Evidence for ADR-006/ADR-008: the runner image lists Edge but not the WebView2 Runtime, and whether a
      # desktop session is available is unproven. Record what is there before trying the GUI smoke.
      - name: Probe WebView2 Runtime (evidence)
        shell: pwsh
        run: |
          $keys = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
                  'HKCU:\Software\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $found = $keys | Where-Object { Test-Path $_ } | ForEach-Object { (Get-ItemProperty $_).pv }
          "WebView2 Runtime: $(if ($found) { $found -join ', ' } else { 'not found' })"
          "Session: $([Environment]::UserInteractive) / $env:SESSIONNAME"
          # A hosted run ignored WEBVIEW2_BROWSER_EXECUTABLE_FOLDER; record loader policy overrides for the diagnosis.
          $policy = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2', 'HKCU:\Software\Policies\Microsoft\Edge\WebView2' | Where-Object { Test-Path $_ }
          "WebView2 loader policy keys: $(if ($policy) { $policy -join ', ' } else { 'none' })"

      # Launches the real WPF + WebView2 shell, loads the bundled UI, round-trips commands over the message bridge,
      # then creates, exports and previews a fixture character. Non-blocking until it has passed on hosted runners;
      # promote it to blocking after three consecutive green runs (ADR-006 "Not yet proven").
      - name: Desktop shell smoke (non-blocking)
        id: smoke
        continue-on-error: true
        shell: pwsh
        run: scripts/smoke.ps1 -Exe src/DesktopShell/bin/Release/net10.0-windows/TomeStack.exe -Report "$env:RUNNER_TEMP/smoke-result.json"

      # Uses the smoke-only --simulate-missing-webview2 flag; the loader env override was ignored on this runner.
      - name: Missing WebView2 runtime path (non-blocking)
        continue-on-error: true
        shell: pwsh
        run: scripts/offline-check.ps1 -Mode MissingRuntime

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-result
          path: ${{ runner.temp }}/smoke-result.json
          if-no-files-found: warn
